# Drop-in for soc-thief-reconcile.service: install as
# /etc/systemd/system/soc-thief-reconcile.service.d/openai.conf to use the OpenAI-compatible model
# backend instead of Ollama. See docs/MODELS.md. It changes only the model selection, the key
# credential and which host loopback port the container may reach. Remove it and run
# `systemctl daemon-reload` to return to Ollama.
# Install soc-thief-runner-openai.conf with it, so the daily and late-alert passes use one model.
# Set in /etc/soc-thief/environment:
#   SOC_THIEF_OPENAI_BASE_URL, SOC_THIEF_OPENAI_MODEL, and SOC_THIEF_OPENAI_PORT (the host loopback
#   port forwarded into the container: the local server's port, or SOC_THIEF_MODEL_PORT for a
#   remote endpoint). A remote endpoint also needs SOC_THIEF_OPENAI_ALLOW_REMOTE=1 and an egress rule.
# The key is required: /etc/soc-thief/secrets/openai_key, root 0600. A server without keys
# accepts any placeholder value. Without the file systemd fails the unit before any container starts.
# The two defaults below are overridden by the environment file.
[Service]
Environment=SOC_THIEF_OPENAI_TIMEOUT_SECONDS=60
Environment=SOC_THIEF_OPENAI_ALLOW_REMOTE=0
LoadCredential=openai_key:/etc/soc-thief/secrets/openai_key
ExecStart=
ExecStart=/usr/bin/flock --exclusive /run/soc-thief/priority.lock /usr/bin/podman --root /var/lib/soc-thief/podman --runroot /run/soc-thief/podman run --pull=never --rm --replace --name soc-thief-reconcile --read-only --cap-drop=ALL --security-opt=no-new-privileges --userns=keep-id:uid=65532,gid=65532 --network pasta:-T,${SOC_THIEF_INDEXER_PORT},-T,${SOC_THIEF_OPENAI_PORT} --add-host ${SOC_THIEF_INDEXER_ALIAS}:127.0.0.1 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m --volume /var/lib/soc-thief:/var/lib/soc-thief:Z --mount type=bind,src=%d,dst=/run/secrets,ro=true,relabel=private --env WAZUH_INDEXER_URL_FILE=/run/secrets/wazuh_indexer_url --env WAZUH_INDEXER_USERNAME_FILE=/run/secrets/wazuh_indexer_username --env WAZUH_INDEXER_PASSWORD_FILE=/run/secrets/wazuh_indexer_password --env WAZUH_INDEXER_CA_FILE=/run/secrets/wazuh_indexer_ca --env DISCORD_WEBHOOK_URL_FILE=/run/secrets/discord_webhook_url --env SOC_THIEF_IDENTITY_KEY_FILE=/run/secrets/identity_key --env SOC_THIEF_RUNNER_APPROVAL_FILE=/run/secrets/runner_approval --env SOC_THIEF_TUNING_FILE=/run/secrets/tuning --env SOC_THIEF_MODEL_BACKEND=openai --env SOC_THIEF_OPENAI_BASE_URL=${SOC_THIEF_OPENAI_BASE_URL} --env SOC_THIEF_OPENAI_MODEL=${SOC_THIEF_OPENAI_MODEL} --env SOC_THIEF_OPENAI_API_KEY_FILE=/run/secrets/openai_key --env SOC_THIEF_OPENAI_TIMEOUT_SECONDS=${SOC_THIEF_OPENAI_TIMEOUT_SECONDS} --env SOC_THIEF_OPENAI_ALLOW_REMOTE=${SOC_THIEF_OPENAI_ALLOW_REMOTE} --env MODEL_BASE_URL=http://127.0.0.1:${SOC_THIEF_MODEL_PORT} --env MODEL_NAME=qwen3:4b --env MODEL_TIMEOUT_SECONDS=60 --env STATE_PATH=/var/lib/soc-thief/state --env SOC_THIEF_TIMEZONE=${SOC_THIEF_TIMEZONE} --entrypoint python ${SOC_THIEF_IMAGE} -m soc_thief.runner --reconcile
