# Optional Jev backend for the daily runner. See docs/MODELS.md#jev-experimental.
# Bring your own key in /etc/soc-thief/secrets/jev_key (root-owned, 0600): a TypeSafe key for
# the default route, or an OpenRouter key for the openrouter route.
# Pick the route with SOC_THIEF_JEV_ENDPOINT in /etc/soc-thief/environment:
#   typesafe   (default) TypeSafe's own API, api.typesafe.ai, model jev-latest
#   openrouter OpenRouter's System One API, openrouter.ai, model typesafe/jev-1.13
#   vercel     the older Vercel AI Gateway route, kept for existing deployments
# SOC_THIEF_JEV_MODEL there pins a model other than the route's default.
# Egress must allow the chosen route's host: python -m soc_thief.jev_egress --endpoint <route>.
# The values below are defaults; /etc/soc-thief/environment overrides them.
[Service]
LoadCredential=jev_key:/etc/soc-thief/secrets/jev_key
Environment=SOC_THIEF_JEV_ENDPOINT=typesafe
Environment=SOC_THIEF_JEV_MODEL=
ExecStart=
ExecStart=/usr/bin/flock --exclusive /run/soc-thief/priority.lock /usr/bin/podman --root /var/lib/soc-thief/podman --runroot /run/soc-thief/podman run --pull=never --rm --replace --name soc-thief-runner --read-only --cap-drop=ALL --security-opt=no-new-privileges --userns=keep-id:uid=65532,gid=65532 --network pasta:-T,${SOC_THIEF_INDEXER_PORT},-T,${SOC_THIEF_MODEL_PORT} --add-host ${SOC_THIEF_INDEXER_ALIAS}:127.0.0.1 --add-host ${SOC_THIEF_NTFY_ALIAS}:${SOC_THIEF_NTFY_ADDR} --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m --volume /var/lib/soc-thief:/var/lib/soc-thief:Z --mount type=bind,src=%d,dst=/run/secrets,ro=true,relabel=private --env WAZUH_INDEXER_URL_FILE=/run/secrets/wazuh_indexer_url --env WAZUH_INDEXER_USERNAME_FILE=/run/secrets/wazuh_indexer_username --env WAZUH_INDEXER_PASSWORD_FILE=/run/secrets/wazuh_indexer_password --env WAZUH_INDEXER_CA_FILE=/run/secrets/wazuh_indexer_ca --env DISCORD_WEBHOOK_URL_FILE=/run/secrets/discord_webhook_url --env SOC_THIEF_IDENTITY_KEY_FILE=/run/secrets/identity_key --env SOC_THIEF_RUNNER_APPROVAL_FILE=/run/secrets/runner_approval --env SOC_THIEF_TUNING_FILE=/run/secrets/tuning --env SOC_THIEF_JEV_TRIAL=1 --env SOC_THIEF_JEV_KEY_FILE=/run/secrets/jev_key --env SOC_THIEF_JEV_ENDPOINT=${SOC_THIEF_JEV_ENDPOINT} --env SOC_THIEF_JEV_MODEL=${SOC_THIEF_JEV_MODEL} --env SOC_THIEF_NTFY_FILE=/run/secrets/ntfy --env MODEL_BASE_URL=http://127.0.0.1:${SOC_THIEF_MODEL_PORT} --env MODEL_NAME=qwen3:4b --env MODEL_TIMEOUT_SECONDS=60 --env STATE_PATH=/var/lib/soc-thief/state --env SOC_THIEF_TIMEZONE=${SOC_THIEF_TIMEZONE} --entrypoint python ${SOC_THIEF_IMAGE} -m soc_thief.runner --daily
