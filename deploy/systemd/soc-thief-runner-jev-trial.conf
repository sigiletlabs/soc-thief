# Optional Jev backend for the daily runner. See docs/MODELS.md#jev-experimental.
# Jev speaks TypeSafe's System One API. Any server that implements it works, hosted or local.
# Pick the route in /etc/soc-thief/environment, one of:
#   SOC_THIEF_JEV_ENDPOINT=typesafe    (default) TypeSafe's own API, api.typesafe.ai, model jev-latest
#   SOC_THIEF_JEV_ENDPOINT=openrouter  OpenRouter's System One API, openrouter.ai, model typesafe/jev-1.13
#   SOC_THIEF_JEV_ENDPOINT=vercel      the older Vercel AI Gateway route, kept for existing deployments
#   SOC_THIEF_JEV_BASE_URL=<url>       any other System One server; the client calls <url>/systemone.
#     It needs SOC_THIEF_JEV_MODEL. http is allowed only to a loopback IP literal such as
#     http://127.0.0.1:<SOC_THIEF_MODEL_PORT> (the one host port this unit forwards). Anything else
#     needs https and SOC_THIEF_JEV_ALLOW_REMOTE=1.
# SOC_THIEF_JEV_MODEL also pins a model other than a preset's default.
# The key is required here: /etc/soc-thief/secrets/jev_key, root-owned, 0600. A local server without
# keys accepts any placeholder value. Without the file systemd fails the unit before any container starts.
# Egress must allow a remote host: python -m soc_thief.jev_egress --endpoint <preset> or --base-url <url>.
# A loopback server needs no egress rule.
# The values below are defaults; /etc/soc-thief/environment overrides them.
[Service]
LoadCredential=jev_key:/etc/soc-thief/secrets/jev_key
Environment=SOC_THIEF_JEV_ENDPOINT=
Environment=SOC_THIEF_JEV_BASE_URL=
Environment=SOC_THIEF_JEV_MODEL=
Environment=SOC_THIEF_JEV_ALLOW_REMOTE=0
ExecStart=
ExecStart=/usr/bin/flock --exclusive /run/soc-thief/priority.lock /usr/bin/podman --root /var/lib/soc-thief/podman --runroot /run/soc-thief/podman run --pull=never --rm --replace --name soc-thief-runner --read-only --cap-drop=ALL --security-opt=no-new-privileges --userns=keep-id:uid=65532,gid=65532 --network pasta:-T,${SOC_THIEF_INDEXER_PORT},-T,${SOC_THIEF_MODEL_PORT} --add-host ${SOC_THIEF_INDEXER_ALIAS}:127.0.0.1 --add-host ${SOC_THIEF_NTFY_ALIAS}:${SOC_THIEF_NTFY_ADDR} --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m --volume /var/lib/soc-thief:/var/lib/soc-thief:Z --mount type=bind,src=%d,dst=/run/secrets,ro=true,relabel=private --env WAZUH_INDEXER_URL_FILE=/run/secrets/wazuh_indexer_url --env WAZUH_INDEXER_USERNAME_FILE=/run/secrets/wazuh_indexer_username --env WAZUH_INDEXER_PASSWORD_FILE=/run/secrets/wazuh_indexer_password --env WAZUH_INDEXER_CA_FILE=/run/secrets/wazuh_indexer_ca --env DISCORD_WEBHOOK_URL_FILE=/run/secrets/discord_webhook_url --env SOC_THIEF_IDENTITY_KEY_FILE=/run/secrets/identity_key --env SOC_THIEF_RUNNER_APPROVAL_FILE=/run/secrets/runner_approval --env SOC_THIEF_TUNING_FILE=/run/secrets/tuning --env SOC_THIEF_JEV_TRIAL=1 --env SOC_THIEF_JEV_KEY_FILE=/run/secrets/jev_key --env SOC_THIEF_JEV_ENDPOINT=${SOC_THIEF_JEV_ENDPOINT} --env SOC_THIEF_JEV_BASE_URL=${SOC_THIEF_JEV_BASE_URL} --env SOC_THIEF_JEV_MODEL=${SOC_THIEF_JEV_MODEL} --env SOC_THIEF_JEV_ALLOW_REMOTE=${SOC_THIEF_JEV_ALLOW_REMOTE} --env SOC_THIEF_NTFY_FILE=/run/secrets/ntfy --env MODEL_BASE_URL=http://127.0.0.1:${SOC_THIEF_MODEL_PORT} --env MODEL_NAME=qwen3:4b --env MODEL_TIMEOUT_SECONDS=60 --env STATE_PATH=/var/lib/soc-thief/state --env SOC_THIEF_TIMEZONE=${SOC_THIEF_TIMEZONE} --entrypoint python ${SOC_THIEF_IMAGE} -m soc_thief.runner --daily
