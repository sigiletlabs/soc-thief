# Drop-in for soc-thief-runner.service: install as
# /etc/systemd/system/soc-thief-runner.service.d/ntfy.conf once /etc/soc-thief/secrets/ntfy exists
# (fast-path format, root 0600) and the host policy allows egress to that ntfy host. Without this
# drop-in the runner still runs; a tuned-rule spike is delivered in the digest with a health failure.
[Service]
LoadCredential=ntfy:/etc/soc-thief/secrets/ntfy
