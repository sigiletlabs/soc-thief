[package]
name = "soc-thief-console"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Read-only terminal and local web dashboard for a Soc Thief snapshot file"
license = "Apache-2.0"
publish = false

[[bin]]
name = "soc-thief-console"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "=4.6.7", features = ["derive"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }

[dev-dependencies]
http-body-util = "=0.1.5"
tower = { version = "=0.5.3", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
